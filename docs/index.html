<!DOCTYPE html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0, viewport-fit=cover" />
    <title>Sky Drift</title>
    <link rel="stylesheet" href="./style.css" />
  </head>
  <body>
    <main class="app-shell">
      <header class="hud" aria-label="Game controls">
        <h1>Sky Drift</h1>
        <div class="hud-row">
          <span id="scoreLabel">Score: 0</span>
          <span id="speedLabel">Speed: 1.0x</span>
        </div>
        <div class="hud-row controls">
          <button id="startBtn" type="button">Start</button>
          <button id="pauseBtn" type="button">Pause</button>
          <button id="restartBtn" type="button">Restart</button>
          <button id="tiltBtn" type="button" hidden>Enable Tilt</button>
        </div>
      </header>

      <section class="play-area" aria-label="Game area">
        <canvas id="gameCanvas"></canvas>
      </section>

      <p class="help-text">
        Drag to steer in any direction &amp; tap to boost — or use arrow keys on desktop.
      </p>
    </main>
    <script type="module" src="./game.js"></script>
  </body>
</html>
